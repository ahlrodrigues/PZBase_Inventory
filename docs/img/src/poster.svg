<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1430"/>
      <stop offset="0.55" stop-color="#7a2e4f"/>
      <stop offset="0.82" stop-color="#f0823c"/>
      <stop offset="1" stop-color="#ffc466"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="512" cy="640" r="230" fill="#ffb347" opacity="0.9"/>

  <!-- silhuetas: chão, casas, caixa d'água, árvores -->
  <g fill="#120c1c">
    <rect x="0" y="760" width="1024" height="264"/>
    <polygon points="70,760 70,670 135,610 200,670 200,760"/>
    <polygon points="790,760 790,650 860,590 930,650 930,760"/>
    <rect x="240" y="560" width="70" height="60" rx="8"/>
    <rect x="244" y="620" width="8" height="140"/>
    <rect x="298" y="620" width="8" height="140"/>
    <circle cx="700" cy="725" r="60"/>
    <circle cx="760" cy="745" r="46"/>
    <circle cx="300" cy="735" r="50"/>
  </g>
  <rect x="95" y="680" width="22" height="26" fill="#ffc466" opacity="0.8"/>
  <rect x="818" y="690" width="24" height="26" fill="#ffc466" opacity="0.8"/>

  <!-- itens saindo da caixa -->
  <circle cx="390" cy="462" r="36" fill="#d9352b" stroke="#3a2110" stroke-width="8"/>
  <path d="M390 426 q8 -30 30 -36" stroke="#2f7a2f" stroke-width="10" fill="none"/>
  <rect x="478" y="410" width="68" height="92" rx="12" fill="#9fb4c7" stroke="#3a2110" stroke-width="8"/>
  <rect x="590" y="440" width="18" height="70" fill="#7a4a1e" stroke="#3a2110" stroke-width="6"/>
  <rect x="570" y="402" width="60" height="44" rx="6" fill="#55595e" stroke="#3a2110" stroke-width="8"/>

  <!-- caixa de contêiner -->
  <rect x="312" y="500" width="400" height="250" rx="22" fill="#c8843a" stroke="#3a2110" stroke-width="14"/>
  <line x1="312" y1="580" x2="712" y2="580" stroke="#3a2110" stroke-width="10"/>
  <line x1="312" y1="668" x2="712" y2="668" stroke="#3a2110" stroke-width="10"/>
  <rect x="470" y="600" width="84" height="40" rx="8" fill="#ffd166" stroke="#3a2110" stroke-width="8"/>

  <!-- área da base (tracejada) -->
  <rect x="186" y="430" width="652" height="400" rx="18" fill="none" stroke="#ffd166" stroke-width="8" stroke-dasharray="28 18"/>

  <!-- título -->
  <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="512" y="190" font-size="150" fill="#ffd166" stroke="#120c1c" stroke-width="12" paint-order="stroke" letter-spacing="-4">PZ BASE</text>
    <text x="512" y="296" font-size="104" fill="#fff4d6" stroke="#120c1c" stroke-width="10" paint-order="stroke">INVENTORY</text>
  </g>

  <!-- rodapé -->
  <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="512" y="930" font-size="44" fill="#fff4d6" letter-spacing="2">PAINEL DO JOGADOR • BASES</text>
    <text x="512" y="990" font-size="34" fill="#ffd166">MARQUE A BASE · VEJA TUDO · ATUALIZE SEM ABRIR</text>
  </g>
</svg>
