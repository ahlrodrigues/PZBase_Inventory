    <rect x="78" y="475" width="7" height="85"/>
    <circle cx="560" cy="545" r="40"/>
    <circle cx="1240" cy="540" r="40"/>
  </g>

  <!-- caixa e área da base, à direita -->
  <g transform="translate(738,-41) scale(0.6)">
    <rect x="312" y="500" width="400" height="250" rx="22" fill="#c8843a" stroke="#3a2110" stroke-width="14"/>
    <line x1="312" y1="580" x2="712" y2="580" stroke="#3a2110" stroke-width="10"/>
    <line x1="312" y1="668" x2="712" y2="668" stroke="#3a2110" stroke-width="10"/>
    <rect x="470" y="600" width="84" height="40" rx="8" fill="#ffd166" stroke="#3a2110" stroke-width="8"/>
