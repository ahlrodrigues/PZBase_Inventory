    <path d="M390 426 q8 -30 30 -36" stroke="#2f7a2f" stroke-width="10" fill="none"/>
    <rect x="478" y="410" width="68" height="92" rx="12" fill="#9fb4c7" stroke="#3a2110" stroke-width="8"/>
    <rect x="590" y="440" width="18" height="70" fill="#7a4a1e" stroke="#3a2110" stroke-width="6"/>
